<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1100" viewBox="0 0 1560 1100" role="img" aria-labelledby="title desc"><title id="title">AP-UI-01｜登入與資料同步</title><desc id="desc">AP-US-03、04 · AP-FR-01、02 · AP-TC-12、13</desc><style>text{font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;fill:#252525;font-variant-numeric:tabular-nums}</style><rect width="1560" height="1100" fill="white"/><text x="40" y="58.0" font-size="36" font-weight="700" style="fill:#252525">AP-UI-01｜登入與資料同步</text><text x="40" y="104.0" font-size="23" font-weight="400" style="fill:#252525">AP-US-03、04 · AP-FR-01、02 · AP-TC-12、13</text><text x="40" y="142.0" font-size="21" font-weight="400" style="fill:#555">介面規劃示意 · 匿名測試資料 · 不代表功能已交付或正式畢業要求</text><text x="40" y="191.0" font-size="27" font-weight="700" style="fill:#252525">操作前：登入及授權同步</text><rect x="40" y="212" width="720" height="750" rx="0" fill="white" stroke="#777" stroke-width="1.5"/><rect x="40" y="212" width="720" height="58" rx="0" fill="#ececec" stroke="#777" stroke-width="1.5"/><text x="60" y="250.0" font-size="23" font-weight="700" style="fill:#252525">NTOUER Academic Planner</text><text x="64" y="326.0" font-size="28" font-weight="700" style="fill:#252525">Google 身分登入</text><rect x="64" y="357" width="230" height="46" rx="3" fill="#333" stroke="#333" stroke-width="1.5"/><text x="78" y="388.0" font-size="21" font-weight="400" style="fill:white">以 Google 登入</text><path d="M64 436 L736 436" stroke="#aaa" fill="none"/><text x="64" y="486.0" font-size="26" font-weight="700" style="fill:#252525">登入後進行教務資料同步</text><text x="64" y="541.0" font-size="23" font-weight="400" style="fill:#252525">教務帳號</text><rect x="64" y="558" width="672" height="48" rx="0" fill="white" stroke="#777" stroke-width="1.5"/><text x="78" y="590.0" font-size="21" font-weight="400" style="fill:#666">匿名學生帳號</text><text x="64" y="651.0" font-size="23" font-weight="400" style="fill:#252525">教務密碼</text><rect x="64" y="668" width="672" height="48" rx="0" fill="white" stroke="#777" stroke-width="1.5"/><text x="78" y="700.0" font-size="21" font-weight="400" style="fill:#252525">●●●●●●●●</text><rect x="64" y="750" width="220" height="46" rx="3" fill="#333" stroke="#333" stroke-width="1.5"/><text x="78" y="781.0" font-size="21" font-weight="400" style="fill:white">授權本次同步</text><text x="64" y="835.0" font-size="22" font-weight="400" style="fill:#252525">帳密僅用於本次同步，不持久保存。</text><text x="64" y="875.0" font-size="22" font-weight="400" style="fill:#252525">尚無資料時仍可手動補充紀錄。</text><text x="800" y="191.0" font-size="27" font-weight="700" style="fill:#252525">異常結果：同步失敗，保留舊資料</text><rect x="800" y="212" width="720" height="750" rx="0" fill="white" stroke="#777" stroke-width="1.5"/><rect x="800" y="212" width="720" height="58" rx="0" fill="#ececec" stroke="#777" stroke-width="1.5"/><text x="820" y="250.0" font-size="23" font-weight="700" style="fill:#252525">NTOUER Academic Planner</text><text x="824" y="326.0" font-size="28" font-weight="700" style="fill:#252525">已登入：匿名學生</text><rect x="824" y="368" width="672" height="92" rx="0" fill="#f3f3f3" stroke="#aaa" stroke-width="1.5"/><text x="840" y="399.0" font-size="21" font-weight="400" style="fill:#252525">此次同步失敗，資料尚未更新</text><text x="840" y="433.0" font-size="21" font-weight="400" style="fill:#252525">前次成功：2026/10/14 09:30（示意）</text><text x="824" y="498.0" font-size="26" font-weight="700" style="fill:#252525">保留前次成功資料與個人修正</text><text x="824" y="551.0" font-size="23" font-weight="400" style="fill:#252525">系所：資訊工程學系　入學年度：113</text><text x="824" y="603.0" font-size="23" font-weight="400" style="fill:#252525">原始修課快照：保留</text><text x="824" y="655.0" font-size="23" font-weight="400" style="fill:#252525">個人修正與計畫：保留</text><rect x="824" y="701" width="166" height="46" rx="3" fill="#333" stroke="#333" stroke-width="1.5"/><text x="838" y="732.0" font-size="21" font-weight="400" style="fill:white">重新同步</text><rect x="1006" y="701" width="220" height="46" rx="3" fill="#f5f5f5" stroke="#333" stroke-width="1.5"/><text x="1020" y="732.0" font-size="21" font-weight="400" style="fill:#252525">手動補充紀錄</text><rect x="824" y="796" width="672" height="92" rx="0" fill="#f3f3f3" stroke="#aaa" stroke-width="1.5"/><text x="840" y="827.0" font-size="21" font-weight="400" style="fill:#252525">同步成功才更新資料時間並重新檢核</text><text x="840" y="861.0" font-size="21" font-weight="400" style="fill:#252525">缺適用規則時顯示缺少規則，不改套其他年度</text><path d="M40 1000 L1520 1000" stroke="#aaa" fill="none"/><text x="40" y="1039.0" font-size="23" font-weight="400" style="fill:#252525">流程：Google 登入 → 教務授權 → 同步成功更新／失敗重試；Google 與 AIS 是不同身分用途。</text></svg>
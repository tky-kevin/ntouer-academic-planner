<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1100" viewBox="0 0 1560 1100" role="img" aria-labelledby="title desc"><title id="title">AP-UI-03｜條件覆蓋與上層重算</title><desc id="desc">AP-US-07 · AP-FR-03、04、06 · AP-TC-10、24</desc><style>text{font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;fill:#252525;font-variant-numeric:tabular-nums}</style><rect width="1560" height="1100" fill="white"/><text x="40" y="58.0" font-size="36" font-weight="700" style="fill:#252525">AP-UI-03｜條件覆蓋與上層重算</text><text x="40" y="104.0" font-size="23" font-weight="400" style="fill:#252525">AP-US-07 · AP-FR-03、04、06 · AP-TC-10、24</text><text x="40" y="142.0" font-size="21" font-weight="400" style="fill:#555">介面規劃示意 · 匿名測試資料 · 不代表功能已交付或正式畢業要求</text><text x="40" y="191.0" font-size="27" font-weight="700" style="fill:#252525">操作前：缺少英文資料，狀態未知</text><rect x="40" y="212" width="720" height="750" rx="0" fill="white" stroke="#777" stroke-width="1.5"/><rect x="40" y="212" width="720" height="58" rx="0" fill="#ececec" stroke="#777" stroke-width="1.5"/><text x="60" y="250.0" font-size="23" font-weight="700" style="fill:#252525">NTOUER Academic Planner</text><rect x="64" y="296" width="672" height="92" rx="0" fill="#f3f3f3" stroke="#aaa" stroke-width="1.5"/><text x="80" y="327.0" font-size="21" font-weight="400" style="fill:#252525">完整測試規則 v0.2／非正式規則</text><text x="80" y="361.0" font-size="21" font-weight="400" style="fill:#252525">其餘必要條件均達標；只測英文狀態變化</text><text x="64" y="441.0" font-size="27" font-weight="700" style="fill:#252525">英文畢業門檻｜0 學分</text><text x="64" y="490.0" font-size="21" font-weight="400" style="fill:#252525">來源：測試條件／對應官方來源見第 8.7 節</text><text x="64" y="540.0" font-size="23" font-weight="400" style="fill:#252525">系統原判斷：尚未確認</text><text x="64" y="590.0" font-size="23" font-weight="700" style="fill:#252525">有效結果：尚未確認（系統判斷）</text><rect x="64" y="621" width="136" height="46" rx="3" fill="#f5f5f5" stroke="#333" stroke-width="1.5"/><text x="78" y="652.0" font-size="21" font-weight="400" style="fill:#252525">已達標</text><rect x="212" y="621" width="136" height="46" rx="3" fill="#f5f5f5" stroke="#333" stroke-width="1.5"/><text x="226" y="652.0" font-size="21" font-weight="400" style="fill:#252525">未達標</text><rect x="360" y="621" width="164" height="46" rx="3" fill="#f5f5f5" stroke="#333" stroke-width="1.5"/><text x="374" y="652.0" font-size="21" font-weight="400" style="fill:#252525">尚未確認</text><rect x="64" y="685" width="150" height="46" rx="3" fill="#333" stroke="#333" stroke-width="1.5"/><text x="78" y="716.0" font-size="21" font-weight="400" style="fill:white">儲存設定</text><rect x="228" y="685" width="210" height="46" rx="3" fill="#f5f5f5" stroke="#333" stroke-width="1.5"/><text x="242" y="716.0" font-size="21" font-weight="400" style="fill:#252525">恢復系統判斷</text><rect x="64" y="768" width="672" height="126" rx="0" fill="#f3f3f3" stroke="#aaa" stroke-width="1.5"/><text x="80" y="799.0" font-size="21" font-weight="400" style="fill:#252525">上層 AND：尚未確認</text><text x="80" y="833.0" font-size="21" font-weight="400" style="fill:#252525">整體：尚有條件待確認</text><text x="80" y="867.0" font-size="21" font-weight="400" style="fill:#252525">總學分：12（覆蓋前後不變）</text><text x="800" y="191.0" font-size="27" font-weight="700" style="fill:#252525">操作後：設為已達標，按下儲存</text><rect x="800" y="212" width="720" height="750" rx="0" fill="white" stroke="#777" stroke-width="1.5"/><rect x="800" y="212" width="720" height="58" rx="0" fill="#ececec" stroke="#777" stroke-width="1.5"/><text x="820" y="250.0" font-size="23" font-weight="700" style="fill:#252525">NTOUER Academic Planner</text><rect x="824" y="296" width="672" height="92" rx="0" fill="#f3f3f3" stroke="#aaa" stroke-width="1.5"/><text x="840" y="327.0" font-size="21" font-weight="400" style="fill:#252525">完整測試規則 v0.2／非正式規則</text><text x="840" y="361.0" font-size="21" font-weight="400" style="fill:#252525">其餘必要條件均達標；只測英文狀態變化</text><text x="824" y="441.0" font-size="27" font-weight="700" style="fill:#252525">英文畢業門檻｜0 學分</text><text x="824" y="490.0" font-size="21" font-weight="400" style="fill:#252525">來源：測試條件／對應官方來源見第 8.7 節</text><text x="824" y="540.0" font-size="23" font-weight="400" style="fill:#252525">系統原判斷：尚未確認</text><text x="824" y="590.0" font-size="23" font-weight="700" style="fill:#252525">有效結果：已達標（學生手動設定）</text><rect x="824" y="621" width="136" height="46" rx="3" fill="#333" stroke="#333" stroke-width="1.5"/><text x="838" y="652.0" font-size="21" font-weight="400" style="fill:white">已達標</text><rect x="972" y="621" width="136" height="46" rx="3" fill="#f5f5f5" stroke="#333" stroke-width="1.5"/><text x="986" y="652.0" font-size="21" font-weight="400" style="fill:#252525">未達標</text><rect x="1120" y="621" width="164" height="46" rx="3" fill="#f5f5f5" stroke="#333" stroke-width="1.5"/><text x="1134" y="652.0" font-size="21" font-weight="400" style="fill:#252525">尚未確認</text><rect x="824" y="685" width="150" height="46" rx="3" fill="#333" stroke="#333" stroke-width="1.5"/><text x="838" y="716.0" font-size="21" font-weight="400" style="fill:white">儲存設定</text><rect x="988" y="685" width="210" height="46" rx="3" fill="#f5f5f5" stroke="#333" stroke-width="1.5"/><text x="1002" y="716.0" font-size="21" font-weight="400" style="fill:#252525">恢復系統判斷</text><rect x="824" y="768" width="672" height="126" rx="0" fill="#f3f3f3" stroke="#aaa" stroke-width="1.5"/><text x="840" y="799.0" font-size="21" font-weight="400" style="fill:#252525">上層 AND：已達標</text><text x="840" y="833.0" font-size="21" font-weight="400" style="fill:#252525">整體：依目前資料與規則，所有條件已滿足</text><text x="840" y="867.0" font-size="21" font-weight="400" style="fill:#252525">總學分：12（覆蓋前後不變）</text><path d="M40 1000 L1520 1000" stroke="#aaa" fill="none"/><text x="40" y="1039.0" font-size="23" font-weight="400" style="fill:#252525">恢復系統判斷 → 英文、AND 與整體恢復未知；不增加學分、不要求上傳證明、不等於校方認證。</text></svg>
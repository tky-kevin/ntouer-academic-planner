<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1100" viewBox="0 0 1560 1100" role="img" aria-labelledby="title desc"><title id="title">AP-UI-11｜系所管理員指派</title><desc id="desc">AP-US-13 · AP-FR-13 · AP-TC-27</desc><style>text{font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;fill:#252525;font-variant-numeric:tabular-nums}</style><rect width="1560" height="1100" fill="white"/><text x="40" y="58.0" font-size="36" font-weight="700" style="fill:#252525">AP-UI-11｜系所管理員指派</text><text x="40" y="104.0" font-size="23" font-weight="400" style="fill:#252525">AP-US-13 · AP-FR-13 · AP-TC-27</text><text x="40" y="142.0" font-size="21" font-weight="400" style="fill:#555">介面規劃示意 · 匿名測試資料 · 不代表功能已交付或正式畢業要求</text><text x="40" y="191.0" font-size="27" font-weight="700" style="fill:#252525">操作前：資工無管理員，由系統管理員代理</text><rect x="40" y="212" width="720" height="750" rx="0" fill="white" stroke="#777" stroke-width="1.5"/><rect x="40" y="212" width="720" height="58" rx="0" fill="#ececec" stroke="#777" stroke-width="1.5"/><text x="60" y="250.0" font-size="23" font-weight="700" style="fill:#252525">NTOUER Academic Planner</text><rect x="64" y="296" width="672" height="92" rx="0" fill="#f3f3f3" stroke="#aaa" stroke-width="1.5"/><text x="80" y="327.0" font-size="21" font-weight="400" style="fill:#252525">系統管理員：最高權限</text><text x="80" y="361.0" font-size="21" font-weight="400" style="fill:#252525">系所管理員：僅限被指派系所</text><text x="64" y="414.0" font-size="25" font-weight="700" style="fill:#252525">系所與管理員</text><rect x="64" y="430" width="672" height="60" rx="0" fill="#fafafa" stroke="#777" stroke-width="1.5"/><text x="78" y="467.0" font-size="21" font-weight="700" style="fill:#252525">資訊工程學系</text><text x="338" y="467.0" font-size="21" font-weight="400" style="fill:#252525">無管理員 → 系統管理員代理</text><text x="640" y="467.0" font-size="21" font-weight="700" style="fill:#6b5300">代理</text><rect x="64" y="496" width="672" height="60" rx="0" fill="white" stroke="#777" stroke-width="1.5"/><text x="78" y="533.0" font-size="21" font-weight="700" style="fill:#252525">商船學系</text><text x="338" y="533.0" font-size="21" font-weight="400" style="fill:#252525">1 位（sandra@…）</text><text x="640" y="533.0" font-size="21" font-weight="700" style="fill:#1f6f43">已指派</text><rect x="64" y="562" width="672" height="60" rx="0" fill="#fafafa" stroke="#777" stroke-width="1.5"/><text x="78" y="599.0" font-size="21" font-weight="700" style="fill:#252525">電機工程學系</text><text x="338" y="599.0" font-size="21" font-weight="400" style="fill:#252525">無管理員</text><text x="640" y="599.0" font-size="21" font-weight="700" style="fill:#6b5300">代理</text><text x="64" y="656.0" font-size="23" font-weight="700" style="fill:#252525">指派對象（Google 身分）</text><rect x="64" y="674" width="672" height="52" rx="0" fill="white" stroke="#777" stroke-width="1.5"/><text x="78" y="709.0" font-size="21" font-weight="400" style="fill:#252525">kevin@mail.ntou.edu.tw</text><text x="64" y="758.0" font-size="21" font-weight="400" style="fill:#252525">授予範圍：113–115 學年度、日間學士班</text><rect x="64" y="790" width="220" height="46" rx="3" fill="#333" stroke="#333" stroke-width="1.5"/><text x="78" y="821.0" font-size="21" font-weight="400" style="fill:white">指派為系所管理員</text><rect x="64" y="862" width="672" height="92" rx="0" fill="#f3f3f3" stroke="#aaa" stroke-width="1.5"/><text x="80" y="893.0" font-size="21" font-weight="400" style="fill:#252525">撤銷最後一位管理員後，恢復由系統管理員發布</text><text x="80" y="927.0" font-size="21" font-weight="400" style="fill:#252525">歷史審核標示不改寫；學生不得自提權限</text><text x="800" y="191.0" font-size="27" font-weight="700" style="fill:#252525">操作後：指派後由系所管理員發布</text><rect x="800" y="212" width="720" height="750" rx="0" fill="white" stroke="#777" stroke-width="1.5"/><rect x="800" y="212" width="720" height="58" rx="0" fill="#ececec" stroke="#777" stroke-width="1.5"/><text x="820" y="250.0" font-size="23" font-weight="700" style="fill:#252525">NTOUER Academic Planner</text><rect x="824" y="296" width="672" height="92" r
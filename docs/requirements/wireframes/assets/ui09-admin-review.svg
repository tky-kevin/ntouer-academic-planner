<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1100" viewBox="0 0 1560 1100" role="img" aria-labelledby="title desc"><title id="title">AP-UI-09｜審核與差異</title><desc id="desc">AP-US-13 · AP-FR-12、18 · AP-TC-19、20、34</desc><style>text{font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;fill:#252525;font-variant-numeric:tabular-nums}</style><rect width="1560" height="1100" fill="white"/><text x="40" y="58.0" font-size="36" font-weight="700" style="fill:#252525">AP-UI-09｜審核與差異</text><text x="40" y="104.0" font-size="23" font-weight="400" style="fill:#252525">AP-US-13 · AP-FR-12、18 · AP-TC-19、20、34</text><text x="40" y="142.0" font-size="21" font-weight="400" style="fill:#555">介面規劃示意 · 匿名測試資料 · 不代表功能已交付或正式畢業要求</text><text x="40" y="191.0" font-size="27" font-weight="700" style="fill:#252525">操作前：檢視差異與審核意見</text><rect x="40" y="212" width="720" height="750" rx="0" fill="white" stroke="#777" stroke-width="1.5"/><rect x="40" y="212" width="720" height="58" rx="0" fill="#ececec" stroke="#777" stroke-width="1.5"/><text x="60" y="250.0" font-size="23" font-weight="700" style="fill:#252525">NTOUER Academic Planner</text><rect x="64" y="296" width="672" height="92" rx="0" fill="#f3f3f3" stroke="#aaa" stroke-width="1.5"/><text x="80" y="327.0" font-size="21" font-weight="400" style="fill:#252525">v0.3 相對 v0.2</text><text x="80" y="361.0" font-size="21" font-weight="400" style="fill:#252525">審核者：系所管理員／可代理</text><text x="64" y="414.0" font-size="23" font-weight="700" style="fill:#252525">差異摘要（結構比較，不靠 AI 判讀）</text><rect x="64" y="430" width="672" height="52" rx="0" fill="white" stroke="#777" stroke-width="1.5"/><text x="78" y="467.0" font-size="21" font-weight="700" style="fill:#252525">新增 R45 體育選修上限</text><text x="338" y="467.0" font-size="21" font-weight="400" style="fill:#252525">來源 S113-09</text><text x="640" y="467.0" font-size="21" font-weight="700" style="fill:#1f6f43">新增</text><rect x="64" y="488" width="672" height="52" rx="0" fill="#fafafa" stroke="#777" stroke-width="1.5"/><text x="78" y="525.0" font-size="21" font-weight="700" style="fill:#252525">R07 核心選修 12</text><text x="338" y="525.0" font-size="21" font-weight="400" style="fill:#252525">未變更，不列差異</text><text x="640" y="525.0" font-size="21" font-weight="700" style="fill:#555555">不變</text><rect x="64" y="546" width="672" height="52" rx="0" fill="white" stroke="#777" stroke-width="1.5"/><text x="78" y="583.0" font-size="21" font-weight="700" style="fill:#252525">新增 R19 進階英文資格</text><text x="338" y="583.0" font-size="21" font-weight="400" style="fill:#252525">來源 S113-09</text><text x="640" y="583.0" font-size="21" font-weight="700" style="fill:#1f6f43">新增</text><rect x="64" y="604" width="672" height="52" rx="0" fill="white" stroke="#777" stroke-width="1.5"/><text x="78" y="641.0" font-size="21" font-weight="700" style="fill:#252525">刪除 R31</text><text x="338" y="641.0" font-size="21" font-weight="400" style="fill:#252525">改列範圍提示，保留歷史</text><text x="640" y="641.0" font-size="21" font-weight="700" style="fill:#8a1f1f">刪除</text><text x="64" y="688.0" font-size="24" font-weight="700" style="fill:#252525">審核意見</text><text x="64" y="726.0" font-size="21" font-weight="400" style="fill:#252525">「R31 刪除需保留原因與來源，其餘同意。」</text><path d="M64 744 L736 744" stroke="#aaa" fill="none"/><rect x="64" y="770" width="150" height="46" rx="3" fill="#f5f5f5" stroke="#333" stroke-width="1.5"/><text x="78" y="801.0" font-size="21" font-weight="400" style="fill:#252525">退回修改</text><rect x="230" y="770" width="180" height="46" rx="3" fill="#333" stroke="#333" stroke-width="1.5"/><text x="244" y="801.0" font-size="21" font-weight="400" style="fill:white">核准並發布</text><rect x="64" y="844" width="672" height="92" rx="0" fill="#f3f3f3" stroke="#aaa" stroke-width="1.5"/><text x="80" y="875.0" font-size="21" font-weight="400" style="fill:#252525">核准前後端重驗權限與內容雜湊</text><text x="80" y="909.0" font-size="21" font-weight="400" style="fill:#252525">代理發布須標記未經系所審核</text><text x="800" y="191.0" font-size="27" font-weight="700" style="fill:#252525">操作後：核准並發布，保留舊版</text><rect x="800" y="212" width="720" height="750" rx="0" fill="white" stroke="#777" stroke-width="1.5"/><rect x="800" y="212" width="720" height="58" rx="0" fill="#ececec" stroke="#777" stroke-width="1.5"/><text x="820" y="250.0" font-size="23" font-weight="700" style="fill:#252525">NTOUER Academic Planner</text><rect x="824" y="296" width="672" height="92" rx="0" fill="#f3f3f3" stroke="#aaa" stroke-width="1.5"/><text x="840" y="327.0" font-size="21" font-weight="400" style="fill:#252525">v0.3 相對 v0.2</text><text x="840" y="361.0" font-size="21" font-weight="400" style="fill:#252525">審核者：系所管理員／可代理</text><text x="824" y="414.0" font-size="23" font-weight="700" style="fill:#252525">差異摘要（結構比較，不靠 AI 判讀）</text><rect x="824" y="430" width="672" height="52" rx="0" fill="white" stroke="#777" stroke-width="1.5"/><text x="838" y="467.0" font-size="21" font-weight="700" style="fill:#252525">新增 R45 體育選修上限</text><text x="1098" y="467.0" font-size="21" font-weight="400" style="fill:#252525">來源 S113-09</text><text x="1400" y="467.0" font-size="21" font-weight="700" style="fill:#1f6f43">新增</text><rect x="824" y="488" width="672" height="52" rx="0" fill="#fafafa" stroke="#777" stroke-width="1.5"/><text x="838" y="525.0" font-size="21" font-weight="700" style="fill:#252525">R07 核心選修 12</text><text x="1098" y="525.0" font-size="21" font-weight="400" style="fill:#252525">未變更，不列差異</text><text x="1400" y="525.0" font-size="21" font-weight="700" style="fill:#555555">不變</text><rect x="824" y="546" width="672" height="52" rx="0" fill="white" stroke="#777" stroke-width="1.5"/><text x="838" y="583.0" font-size="21" font-weight="700" style="fill:#252525">新增 R19 進階英文資格</text><text x="1098" y="583.0" font-size="21" font-weight="400" style="fill:#252525">來源 S113-09</text><text x="1400" y="583.0" font-size="21" font-weight="700" style="fill:#1f6f43">新增</text><rect x="824" y="604" width="672" height="52" rx="0" fill="white" stroke="#777" stroke-width="1.5"/><text x="838" y="641.0" font-size="21" font-weight="700" style="fill:#252525">刪除 R31</text><text x="1098" y="641.0" font-size="21" font-weight="400" style="fill:#252525">改列範圍提示，保留歷史</text><text x="1400" y="641.0" font-size="21" font-weight="700" style="fill:#8a1f1f">刪除</text><text x="824" y="688.0" font-size="24" font-weight="700" style="fill:#252525">審核意見</text><text x="824" y="726.0" font-size="21" font-weight="400" style="fill:#252525">「R31 刪除需保留原因與來源，其餘同意。」</text><path d="M824 744 L1496 744" stroke="#aaa" fill="none"/><text x="824" y="770.0" font-size="24" font-weight="700" style="fill:#252525">已發布 v0.3（經系所管理員審核）</text><text x="824" y="814.0" font-size="21" font-weight="400" style="fill:#252525">學生端改用 v0.3；v0.2 保留並標記 superseded。</text><rect x="824" y="844" width="672" height="58" rx="0" fill="#f3f3f3" stroke="#aaa" stroke-width="1.5"/><text x="840" y="875.0" font-size="21" font-weight="400" style="fill:#252525">發布後不可原地修改；再改＝從 v0.3 複製新草稿</text><path d="M40 1000 L1520 1000" stroke="#aaa" fill="none"/><text x="40" y="1039.0" font-size="23" font-weight="400" style="fill:#252525">審核看的是「改了什麼」：差異由結構比較產生。退回須留原因；發布後不可原地修改，只能產生新版本。</text></svg>
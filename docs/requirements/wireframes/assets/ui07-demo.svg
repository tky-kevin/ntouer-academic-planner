<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1100" viewBox="0 0 1560 1100" role="img" aria-labelledby="title desc"><title id="title">AP-UI-07｜Iteration 1 檢核</title><desc id="desc">AP-US-01、02、12 · AP-FR-02、03、04、11 · AP-TC-01、04、08</desc><style>text{font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;fill:#252525;font-variant-numeric:tabular-nums}</style><rect width="1560" height="1100" fill="white"/><text x="40" y="58.0" font-size="36" font-weight="700" style="fill:#252525">AP-UI-07｜Iteration 1 檢核</text><text x="40" y="104.0" font-size="23" font-weight="400" style="fill:#252525">AP-US-01、02、12 · AP-FR-02、03、04、11 · AP-TC-01、04、08</text><text x="40" y="142.0" font-size="21" font-weight="400" style="fill:#555">介面規劃示意 · 匿名測試資料 · 不代表功能已交付或正式畢業要求</text><text x="40" y="191.0" font-size="27" font-weight="700" style="fill:#252525">操作前：載入 A、B、C，尚未檢核</text><rect x="40" y="212" width="720" height="750" rx="0" fill="white" stroke="#777" stroke-width="1.5"/><rect x="40" y="212" width="720" height="58" rx="0" fill="#ececec" stroke="#777" stroke-width="1.5"/><text x="60" y="250.0" font-size="23" font-weight="700" style="fill:#252525">NTOUER Academic Planner</text><rect x="64" y="296" width="672" height="92" rx="0" fill="#f3f3f3" stroke="#aaa" stroke-width="1.5"/><text x="80" y="327.0" font-size="21" font-weight="400" style="fill:#252525">開發測試規則，僅檢核部分條件</text><text x="80" y="361.0" font-size="21" font-weight="400" style="fill:#252525">test-v0.1：總 12／必修類 6／選修類 6</text><text x="64" y="440.0" font-size="25" font-weight="700" style="fill:#252525">選取紀錄樣本</text><rect x="64" y="460" width="176" height="46" rx="3" fill="#333" stroke="#333" stroke-width="1.5"/><text x="78" y="491.0" font-size="21" font-weight="400" style="fill:white">不足（已選取）</text><rect x="254" y="460" width="130" height="46" rx="3" fill="#f5f5f5" stroke="#333" stroke-width="1.5"/><text x="268" y="491.0" font-size="21" font-weight="400" style="fill:#252525">達標</text><rect x="398" y="460" width="130" 